name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forex_dev
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: forex_analyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements-dev.txt
          pip install ruff
          ruff check .
      - run: |
          cd backend
          source venv/bin/activate
          pytest --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://forex_dev:changeme@localhost:5432/forex_analyst_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd frontend
          npm ci
          npm run lint
          npm run build